apiVersion: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: ${ZABBIX_URL}
    isDefault: true
    jsonData:
      username: ${ZABBIX_USER}
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
    secureJsonData:
      password: ${ZABBIX_PASSWORD}
