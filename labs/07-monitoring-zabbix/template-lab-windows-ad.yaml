zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4f6c2b1e8a9d4c3b9e7f1a2b3c4d5e6f
      name: Templates/Lab
  templates:
    - uuid: 7a1b2c3d4e5f40718293a4b5c6d7e8f9
      template: 'Lab Windows AD'
      name: 'Lab Windows AD'
      description: 'Itens do microsoft-infra-labs: replicacao do AD, contas bloqueadas e idade do backup. Usa os UserParameters de agent2.d/windows-ad.conf.'
      groups:
        - name: Templates/Lab
      items:
        - uuid: 0b1c2d3e4f5a46b7c8d9e0f1a2b3c4d5
          name: 'Falhas de replicacao do AD'
          key: ad.replication.failures
          delay: 5m
          history: 30d
          description: 'Numero de parceiros de replicacao com falha. O certo e 0.'
          tags:
            - tag: component
              value: active-directory
          triggers:
            - uuid: 1c2d3e4f5a6b47c8d9e0f1a2b3c4d5e6
              expression: 'last(/Lab Windows AD/ad.replication.failures)>0'
              name: 'Falha de replicacao do AD em {HOST.NAME}'
              priority: HIGH
        - uuid: 2d3e4f5a6b7c48d9e0f1a2b3c4d5e6f7
          name: 'Contas bloqueadas'
          key: ad.users.locked
          delay: 5m
          history: 30d
          tags:
            - tag: component
              value: active-directory
          triggers:
            - uuid: 3e4f5a6b7c8d49e0f1a2b3c4d5e6f7a8
              expression: 'last(/Lab Windows AD/ad.users.locked)>=10'
              name: 'Muitas contas bloqueadas em {HOST.NAME} (possivel ataque de senha)'
              priority: AVERAGE
        - uuid: 4f5a6b7c8d9e40f1a2b3c4d5e6f7a8b9
          name: 'Idade do ultimo backup'
          key: lab.backup.age.days
          delay: 1h
          history: 90d
          units: d
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: 5a6b7c8d9e0f41a2b3c4d5e6f7a8b9c0
              expression: 'last(/Lab Windows AD/lab.backup.age.days)>1'
              name: 'Backup atrasado em {HOST.NAME} (mais de 1 dia)'
              priority: HIGH
