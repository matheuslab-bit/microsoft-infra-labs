# Custom items for Windows servers / domain controllers (Zabbix Agent 2).
# Built-in keys already cover CPU, memory, disks, services (service.info) and the event log (eventlog[]).

# Number of AD replication failures reported for this DC (0 = healthy).
UserParameter=ad.replication.failures,powershell.exe -NoProfile -NonInteractive -Command "@(Get-ADReplicationFailure -Target $env:COMPUTERNAME -ErrorAction SilentlyContinue | Where-Object FailureCount -gt 0).Count"

# Number of locked-out user accounts in the domain.
UserParameter=ad.users.locked,powershell.exe -NoProfile -NonInteractive -Command "@(Search-ADAccount -LockedOut -UsersOnly).Count"

# Days since the newest Windows Server Backup / snapshot folder was written (backup freshness).
UserParameter=lab.backup.age.days,powershell.exe -NoProfile -NonInteractive -Command "$d = Get-ChildItem 'E:\Backups\files' -Directory -ErrorAction SilentlyContinue | Sort-Object CreationTime -Descending | Select-Object -First 1; if ($d) { [int]((Get-Date) - $d.CreationTime).TotalDays } else { 999 }"
