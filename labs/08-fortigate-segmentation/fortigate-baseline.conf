# FortiOS 7.x reference configuration - segmented network for a small corporate site.
# Lab target: FortiGate-VM (permanent trial license) on Hyper-V. port1 = WAN, port2 = trunk to the core switch.
# Paste section by section in the CLI. Replace the admin trusted host and DNS values for your lab.

config system global
    set hostname "FGT-LAB"
    set timezone "America/Sao_Paulo"
    set admin-sport 8443
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
end

config system interface
    edit "port1"
        set mode dhcp
        set allowaccess ping
        set role wan
    next
    edit "vlan10-srv"
        set vdom "root"
        set interface "port2"
        set vlanid 10
        set ip 10.50.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Servidores (DC, FS)"
    next
    edit "vlan20-est"
        set vdom "root"
        set interface "port2"
        set vlanid 20
        set ip 10.50.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set dhcp-relay-service enable
        set dhcp-relay-ip "10.50.10.10"
        set description "Estacoes - DHCP via relay para o DC01"
    next
    edit "vlan99-mgmt"
        set vdom "root"
        set interface "port2"
        set vlanid 99
        set ip 10.50.99.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set description "Gerencia - unica VLAN com acesso administrativo"
    next
end

config system admin
    edit "admin"
        set trusthost1 10.50.99.0 255.255.255.0
    next
end

config firewall address
    edit "net-servidores"
        set subnet 10.50.10.0 255.255.255.0
    next
    edit "net-estacoes"
        set subnet 10.50.20.0 255.255.255.0
    next
    edit "net-gerencia"
        set subnet 10.50.99.0 255.255.255.0
    next
    edit "host-dc01"
        set subnet 10.50.10.10 255.255.255.255
    next
    edit "host-fs01"
        set subnet 10.50.10.20 255.255.255.255
    next
end

config firewall service custom
    edit "AD-RPC-DYNAMIC"
        set tcp-portrange 49152-65535
        set comment "RPC dynamic ports used by AD replication and management"
    next
    edit "SMB-445"
        set tcp-portrange 445
    next
end

config firewall service group
    edit "grp-ad-services"
        set member "DNS" "KERBEROS" "LDAP" "NTP" "SMB-445" "AD-RPC-DYNAMIC"
    next
end

config firewall policy
    edit 10
        set name "Estacoes -> DC01 (servicos AD)"
        set srcintf "vlan20-est"
        set dstintf "vlan10-srv"
        set srcaddr "net-estacoes"
        set dstaddr "host-dc01"
        set action accept
        set schedule "always"
        set service "grp-ad-services"
        set logtraffic all
    next
    edit 20
        set name "Estacoes -> FS01 (arquivos)"
        set srcintf "vlan20-est"
        set dstintf "vlan10-srv"
        set srcaddr "net-estacoes"
        set dstaddr "host-fs01"
        set action accept
        set schedule "always"
        set service "SMB-445"
        set logtraffic all
    next
    edit 30
        set name "Estacoes -> Internet"
        set srcintf "vlan20-est"
        set dstintf "port1"
        set srcaddr "net-estacoes"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set webfilter-profile "default"
        set av-profile "default"
        set nat enable
        set logtraffic all
    next
    edit 40
        set name "Servidores -> Internet (atualizacoes)"
        set srcintf "vlan10-srv"
        set dstintf "port1"
        set srcaddr "net-servidores"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "NTP"
        set nat enable
        set logtraffic all
    next
    edit 50
        set name "Gerencia -> todas as redes"
        set srcintf "vlan99-mgmt"
        set dstintf "vlan10-srv" "vlan20-est"
        set srcaddr "net-gerencia"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
# Anything not matched above hits the implicit deny (policy 0), which should also log:
config log setting
    set fwpolicy-implicit-log enable
end
