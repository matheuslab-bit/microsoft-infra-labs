name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze scripts and module
        run: |
          # tests/ is excluded: Pester's BeforeAll/It scoping triggers false 'unused variable' warnings.
          $results = 'labs', 'modules', 'toolkit' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results) { throw "PSScriptAnalyzer found $($results.Count) issue(s)." }

  test:
    name: Tests (Pester) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

  javascript:
    name: Tests (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automacao-js
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run node --test
        run: |
          node --version
          npm test

  shell:
    name: ShellCheck (Linux scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: shellcheck
        run: shellcheck toolkit/linux/*.sh

  compose:
    name: Validate docker-compose (Zabbix and Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lab: [07-monitoring-zabbix, 10-grafana-dashboards]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: docker compose config
        working-directory: labs/${{ matrix.lab }}
        run: |
          cp .env.example .env
          docker compose config --quiet
